<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HDB Sandbox — Theme Directions</title>
<link rel="stylesheet" href="assets/tokens.css" />
<style>
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ab-frame { width: 1280px; height: 800px; border: 0; display: block; background: #f3efe9; }
  .ab-wrap { position: relative; width: 1280px; height: 800px; overflow: hidden; }
  .ab-badge {
    position: absolute; left: 14px; top: 14px; z-index: 5;
    display: flex; gap: 8px; align-items: center; pointer-events: none;
  }
  .ab-sw { width: 16px; height: 16px; border-radius: 5px; box-shadow: 0 0 0 2px rgba(255,255,255,0.7); }
  .ab-note { font-size: 13px; color: #6b6157; line-height: 1.5; max-width: 760px; }
  .ab-note b { color: #2c2620; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { useState } = React;

const THEMES = [
  { id: 'clay', name: 'Clay', accent: 'oklch(0.6 0.125 42)', neutral: 'oklch(0.93 0.014 70)',
    story: 'The warm anchor. Paper-toned neutrals and a soft terracotta accent — domestic, calm, IKEA-planner friendly. The recommended default.' },
  { id: 'kampong', name: 'Kampong', accent: 'oklch(0.55 0.1 152)', neutral: 'oklch(0.93 0.016 100)',
    story: 'Singapore tropical. Sand neutrals with a garden-green accent — evokes greenery, louvers and rattan. Lively yet restrained.' },
  { id: 'porcelain', name: 'Porcelain', accent: 'oklch(0.58 0.075 200)', neutral: 'oklch(0.94 0.005 240)',
    story: 'Refined & premium. Cool porcelain neutrals with a quiet teal-jade accent. The most architectural / studio-grade reading.' },
  { id: 'estate', name: 'Estate', accent: 'oklch(0.64 0.12 62)', neutral: 'oklch(0.93 0.006 80)',
    story: 'Material-honest. Warm HDB-concrete greys with an amber/ochre accent — utilitarian warmth that nods to the block itself.' },
];

const AB_W = 1280, AB_H = 800;

function Board({ theme, mode }) {
  return (
    <div className="ab-wrap">
      <iframe className="ab-frame"
        src={`HDB%20Sandbox.html?theme=${theme}&mode=${mode}&embed=1`} />
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      {THEMES.map((t) => (
        <DCSection key={t.id} id={t.id} title={t.name}
          subtitle={mode_label(t)}>
          <DCArtboard id={`${t.id}-light`} label={`${t.name} · Light`} width={AB_W} height={AB_H}>
            <Board theme={t.id} mode="light" />
          </DCArtboard>
          <DCArtboard id={`${t.id}-dark`} label={`${t.name} · Dark`} width={AB_W} height={AB_H}>
            <Board theme={t.id} mode="dark" />
          </DCArtboard>
        </DCSection>
      ))}
    </DesignCanvas>
  );
}
function mode_label(t) { return t.story; }

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
