# nginx site config for the Docker image (see ../Dockerfile).
# Serves the Vite build (dist/) at the root path and replicates the dev-only
# CC0 asset proxies from vite.config.ts so remote catalogs work same-origin.

# Types nginx's default mime.types is missing; wrong/absent types break Draco
# and Basis decoding (wasm) and GLB/KTX2 fetches.
types {
  application/wasm wasm;
  model/gltf-binary glb;
  image/ktx2 ktx2;
  application/manifest+json webmanifest;
}

# Resolve upstream hostnames at request time inside the container.
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm
             application/manifest+json image/svg+xml;

  # index.html and the service worker must always revalidate — the PWA
  # update-prompt flow (src/pwa/swUpdate.ts) depends on picking up a new sw.js.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Hashed build output is immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- CC0 provider proxies (mirror vite.config.ts server.proxy) ----------
  # ambientCG API + CDN and Kenney don't ship CORS headers; same-origin paths
  # let the app fetch them without CORS. Trailing slashes strip the prefix.
  location /acg/ {
    proxy_pass https://ambientcg.com/;
    proxy_set_header Host ambientcg.com;
    proxy_ssl_server_name on;
  }
  location /acg-cdn/ {
    proxy_pass https://acg-media.ambientcg.com/;
    proxy_set_header Host acg-media.ambientcg.com;
    proxy_ssl_server_name on;
  }
  location /kenney/ {
    proxy_pass https://kenney.nl/;
    proxy_set_header Host kenney.nl;
    proxy_ssl_server_name on;
  }

  # SPA fallback: serve index.html for app navigations. The user guide under
  # /docs/ (present only in build:all images) must NOT fall through to the app
  # shell — mirror the SW's navigateFallbackDenylist.
  location /docs/ {
    try_files $uri $uri/index.html =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
