name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Least-privilege default for every job — CI only reads the checked-out code
# (no writes to contents/PRs/checks). Overridable per-job if a future job needs more.
permissions:
  contents: read

jobs:
  quality:
    name: Format / Lint / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci

      # Formatting is enforced — `npm run format` fixes any failures locally.
      - name: Check formatting
        run: npm run format:check

      # Typecheck (tsc) must pass.
      - name: Typecheck
        run: npx tsc --noEmit

      # Lint is now blocking — the pre-existing error backlog is cleared
      # (`npm run lint` exits 0; only intentional `noExplicitAny` warnings in
      # test files remain, which Biome does not fail on by default).
      - name: Lint
        run: npm run lint

  deadcode:
    name: Dead-code scan (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci

      # knip flags orphaned files, unresolved imports, unused exports/types and
      # unused dependencies. EVERY rule in knip.jsonc is `error`, so any of them
      # fails the build — this comment claimed only `files`/`unresolved` did,
      # which was stale and cost a red CI run to discover (v0.31.7.2). It is not
      # in the pre-commit trio (`npm test`/tsc/biome), so run `npm run deadcode`
      # before opening a PR that adds exports.
      # Fast (single pass, ~10s) so it runs as its own job, not in the test job.
      - name: Dead-code scan
        run: npm run deadcode

  test:
    name: Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci

      # Full unit/integration suite, split across two parallel shards
      # (~4.8k tests; node-default env + threads pool keep each shard ~1 min).
      # Goes through `npm test` (NOT bare `npx vitest`) so the script's
      # NODE_OPTIONS=--no-webstorage is applied — Node >= 25 otherwise shadows
      # happy-dom's localStorage and every DOM test fails (see ARCHITECTURE.md).
      - name: Run test suite
        run: npm test -- --shard=${{ matrix.shard }}/2
