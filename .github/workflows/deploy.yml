name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish (don't cancel mid-publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match ci.yml (node 24 / npm 11): the lockfile is resolved with
          # npm 11's peer-dependency strategy, which differs from npm 10
          # (shipped with node 20) for the @docsearch/react react<19 peer
          # conflict — npm 10's `npm ci` then rejects the lock as out of sync.
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:all
      # SPA fallback: GitHub Pages serves 404.html for unknown routes; make it
      # a copy of index.html so client-side routing/deep links resolve.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html
      # Disable Jekyll so files/dirs beginning with _ are served verbatim.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
