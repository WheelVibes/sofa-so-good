name: Desktop Release

# Package the Electron desktop shell for Windows / macOS / Linux.
# - On a v* tag: builds AND publishes the installers to the GitHub release.
# - On push to main / manual dispatch: builds only (publish never) — the
#   installers are attached to the workflow run as artifacts, the per-merge
#   test-build channel (same idea as the Android debug-APK workflow).
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # electron-builder publishes release assets on tags

jobs:
  desktop:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Test-only browser downloads (puppeteer/playwright devDeps) waste CI time.
      PUPPETEER_SKIP_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # ELECTRON_CACHE / ELECTRON_BUILDER_CACHE are exported by the
      # "Point electron caches outside the workspace" step below — the `runner`
      # context isn't valid in job-level env, and the cache MUST live outside
      # the repo (see that step's comment for the ESM-misparse failure mode).
      # Keychain auto-discovery stays off (both channels) so a stray identity on
      # the runner can never sign a build by accident.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # NOTE (DESKTOP-MAC-UNSIGNED): the signing secrets (CSC_LINK/APPLE_*/WIN_*)
      # are deliberately NOT in this job-level env. A GitHub secret that isn't set
      # is exported as an EMPTY STRING, not unset — and an empty `CSC_LINK=""` is
      # electron-builder's worst case: present-but-invalid, so it reads it as a
      # certificate FILE PATH, resolves it against the repo root, and dies on macOS
      # with `⨯ <repo> not a file` (Windows treats signing as optional and skips,
      # so only mac failed). The secrets live in the tag-only publish step below,
      # so a secretless push-to-main build never exports them at all.
    steps:
      - uses: actions/checkout@v4

      # Cache Electron + electron-builder tool downloads (NSIS/winCodeSign/
      # icons-bundle/fpm/AppImage tooling) so a mirror 504 can't fail the build
      # (the 2026-07-09 ubuntu+windows failures died there mid-download).
      # MUST live OUTSIDE the workspace ($RUNNER_TEMP): electron-builder runs
      # the extracted icon-tool.js (CommonJS, .js) with plain node, and a cache
      # inside the repo puts our package.json `"type": "module"` in its
      # ancestor chain → `require is not defined in ES module scope` (the
      # 2026-07-11 mac+windows failure; linux skips ico/icns conversion, which
      # is why it passed). $RUNNER_TEMP is set on every OS (bash shell incl.
      # Git Bash on Windows). https://www.electron.build/docs/features/github-actions/
      - name: Point electron caches outside the workspace
        shell: bash
        run: |
          echo "ELECTRON_CACHE=$RUNNER_TEMP/eb-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/eb-cache/electron-builder" >> "$GITHUB_ENV"

      # Persist the Electron zip + builder tooling across runs so a mirror
      # outage can't fail the build once a runner has seen this version.
      - name: Cache Electron + builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eb-cache
          # v2 key: the v1 cache stored the workspace-relative layout that
          # triggered the ESM misparse — never restore it.
          key: electron-builder-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'electron-builder.yml') }}
          restore-keys: electron-builder-v2-${{ runner.os }}-

      # Guard: the tag must match src/version.ts exactly. The desktop shell's
      # update check compares the latest release tag against its baked-in
      # APP_VERSION — a tag ahead of the code would make installed apps see a
      # perpetual "update available" for a build they already run.
      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # windows runners default to pwsh
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(sed -n "s/^export const APP_VERSION = '\([0-9.]*\)'.*/\1/p" src/version.ts)
          if [ -z "$APP" ]; then
            echo "::error::Could not read APP_VERSION from src/version.ts"
            exit 1
          fi
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG does not match APP_VERSION $APP (src/version.ts) — retag the commit that ships this version."
            exit 1
          fi
          echo "Tag v$TAG matches APP_VERSION."

      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci

      # Vite build with VITE_BASE=./ + VITE_DISABLE_PWA=1 (scripts/build-desktop.mjs).
      - name: Build web bundle for desktop
        run: npm run build:desktop

      # Signed + notarized publish — TAG builds only. The signing secrets are
      # scoped to THIS step (see the DESKTOP-MAC-UNSIGNED note above): when they
      # exist electron-builder signs (mac) + notarizes (Apple creds) + signs
      # (Windows), and `--publish always` attaches the installers to the release.
      - name: Package + publish (tag)
        if: startsWith(github.ref, 'refs/tags/')
        # Retry ×3 with backoff: the tool-download mirror 504s transiently (the
        # 2026-07-09 failure class); the cache above makes retries cheap.
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder --publish always && exit 0
            echo "electron-builder attempt $i failed; retrying in $((i*30))s…"
            sleep $((i*30))
          done
          exit 1
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Artifact-only UNSIGNED build — push to main / manual dispatch. No signing
      # secrets in env at all, and macOS signing is explicitly disabled:
      # `mac.identity=null` skips signing (avoids any ad-hoc/cert lookup) and
      # `mac.hardenedRuntime=false` keeps the unsigned .app launchable (hardened
      # runtime without a signature blocks launch — electron-builder's documented
      # unsigned-build pairing). The mac.* overrides are ignored on win/linux.
      - name: Package unsigned (artifact-only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        # `shell: bash` on ALL runners (Git Bash on Windows) — the default pwsh on
        # Windows mis-tokenises electron-builder's `-c.<dotted>=<val>` overrides
        # and reads `.mac.hardenedRuntime=false` as a config FILE path (ENOENT).
        # And the `mac.*` overrides only make sense on the mac runner, so scope
        # them there: identity=null skips signing, hardenedRuntime=false keeps the
        # unsigned .app launchable. Windows/Linux take the plain command (no dotted
        # args → nothing to mis-parse); their unsigned builds already work.
        shell: bash
        # Retry ×3 with backoff — the builder-binaries mirror intermittently
        # 504s mid tool-download (2026-07-09 ubuntu+windows failures); with the
        # cache step above, a retry (or the next run) hits the local copy.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            EB_ARGS=(-c.mac.identity=null -c.mac.hardenedRuntime=false)
          else
            EB_ARGS=()
          fi
          for i in 1 2 3; do
            npx electron-builder --publish never "${EB_ARGS[@]}" && exit 0
            echo "electron-builder attempt $i failed; retrying in $((i*30))s…"
            sleep $((i*30))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
