name: Desktop Release

# Package the Electron desktop shell for Windows / macOS / Linux.
# - On a v* tag: builds AND publishes the installers to the GitHub release.
# - On push to main / manual dispatch: builds only (publish never) — the
#   installers are attached to the workflow run as artifacts, the per-merge
#   test-build channel (same idea as the Android debug-APK workflow).
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # electron-builder publishes release assets on tags

jobs:
  desktop:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Test-only browser downloads (puppeteer/playwright devDeps) waste CI time.
      PUPPETEER_SKIP_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Code signing — activates automatically when the repo secrets exist;
      # without them electron-builder ships unsigned artifacts (with a warning)
      # instead of failing. Keychain auto-discovery stays off so a stray
      # identity on the runner can never sign a release by accident.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # macOS: base64 .p12 certificate + its password.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      # macOS notarization (needs the cert above + hardenedRuntime, already set
      # in electron-builder.yml): Apple ID + app-specific password + team id.
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows: base64 .pfx certificate + its password.
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Guard: the tag must match src/version.ts exactly. The desktop shell's
      # update check compares the latest release tag against its baked-in
      # APP_VERSION — a tag ahead of the code would make installed apps see a
      # perpetual "update available" for a build they already run.
      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # windows runners default to pwsh
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(sed -n "s/^export const APP_VERSION = '\([0-9.]*\)'.*/\1/p" src/version.ts)
          if [ -z "$APP" ]; then
            echo "::error::Could not read APP_VERSION from src/version.ts"
            exit 1
          fi
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG does not match APP_VERSION $APP (src/version.ts) — retag the commit that ships this version."
            exit 1
          fi
          echo "Tag v$TAG matches APP_VERSION."

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci

      # Vite build with VITE_BASE=./ + VITE_DISABLE_PWA=1 (scripts/build-desktop.mjs).
      - name: Build web bundle for desktop
        run: npm run build:desktop

      - name: Package (publish on tag)
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
